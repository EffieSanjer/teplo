name: Checks
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wishlist_test
          POSTGRES_USER: wishlist
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wishlist -d wishlist_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - run: pip install -c backend/requirements-dev.lock.txt -e './backend[test]'
      - run: ruff check backend/src backend/tests --config backend/pyproject.toml
      - run: pytest backend/tests -q
      - run: pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://wishlist:test-password@localhost/wishlist_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high
