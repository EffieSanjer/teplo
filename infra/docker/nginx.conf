map_hash_bucket_size 128;

map $http_origin $invalid_origin {
    default 1;
    "" 0;
    "${PUBLIC_ORIGIN}" 0;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    if ($http_host != "${PUBLIC_AUTHORITY}") { return 444; }
    if ($invalid_origin) { return 403; }
    client_max_body_size 6m;
    client_body_timeout 15s;
    # Keep static bundles small on slow mobile connections. Do not compress
    # authenticated API responses containing user data or credentials.
    # Never record gift URLs, tokens or personal navigation in access logs.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location /api/ {
        gzip off;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        # Do not force no-store here: media responses bring their own Cache-Control.
    }

    # Fingerprinted assets and cover photos can be cached on the device.
    location ~* \.(?:css|js|woff2?|jpg|jpeg|png|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    location / {
        gzip on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/css application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
