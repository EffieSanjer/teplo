name: friends-wishlist

x-backend: &backend
  build:
    context: ./backend
    dockerfile: ../infra/docker/backend.Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wishlist}:${POSTGRES_PASSWORD:-local-wishlist-password}@db/${POSTGRES_DB:-wishlist}
    MEDIA_ROOT: /data/media
  volumes:
    - media:/data/media

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wishlist}
      POSTGRES_USER: ${POSTGRES_USER:-wishlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-wishlist-password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: [uvicorn, src.main:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; from urllib.parse import urlsplit; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health',headers={'Host':urlsplit(os.environ.get('PUBLIC_BASE_URL','http://localhost:3000')).netloc}); urllib.request.urlopen(r,timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider --header="Host: $${PUBLIC_BASE_URL#*://}" http://127.0.0.1/api/v1/health']
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  bot:
    <<: *backend
    command: [python, -m, src.integrations.telegram.bot]
    profiles: [telegram]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres:
  media:
